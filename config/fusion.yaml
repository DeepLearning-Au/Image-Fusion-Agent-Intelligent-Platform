# 图像融合模型配置
fusion:
  backend: "MambaDFuse"
  device: "auto"
  tile_size: 256
  overlap: 32
  use_tile: false

mambadfuse:
  root_candidates:
    - "third_party/MambaDFuse-main"
    - "third_party/MambaDFuse"

  weights_dir: "Model/Infrared_Visible_Fusion/Infrared_Visible_Fusion/models"
  iter_number: "10000"
  prefer_weight_type: "E"
  fallback_weight_type: "G"

  scale: 1
  in_channel: 1
  out_channel: 1
  img_size: 128
  window_size: 8
  embed_dim: 60
  img_range: 1.0

  model_name: "MambaDFuse / Official"

legacy_compat:
  enable: true
  model_name: "WEMFusion / Local-MambaDFuse"
